<svg viewBox="0 0 40 40" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <filter id="iconGlow">
      <feGaussianBlur stdDeviation="1.5" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <!-- Crosshair circles -->
  <circle cx="20" cy="20" r="14" fill="none" stroke="#00E5FF" stroke-width="1" filter="url(#iconGlow)" opacity="0.6"/>
  <circle cx="20" cy="20" r="8" fill="none" stroke="#00E5FF" stroke-width="1" opacity="0.4"/>
  <circle cx="20" cy="20" r="2" fill="#00E5FF" filter="url(#iconGlow)"/>
  <!-- Crosshair lines -->
  <line x1="20" y1="4" x2="20" y2="12" stroke="#00E5FF" stroke-width="1" opacity="0.5"/>
  <line x1="20" y1="28" x2="20" y2="36" stroke="#00E5FF" stroke-width="1" opacity="0.5"/>
  <line x1="4" y1="20" x2="12" y2="20" stroke="#00E5FF" stroke-width="1" opacity="0.5"/>
  <line x1="28" y1="20" x2="36" y2="20" stroke="#00E5FF" stroke-width="1" opacity="0.5"/>
</svg>
