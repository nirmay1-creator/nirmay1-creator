<svg viewBox="0 0 1200 250" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="w1" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#00E5FF" stop-opacity="0.25"/>
      <stop offset="50%" stop-color="#7C3AED" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#A855F7" stop-opacity="0.25"/>
    </linearGradient>
    <linearGradient id="w2" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#4D7CFF" stop-opacity="0.15"/>
      <stop offset="50%" stop-color="#00E5FF" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#7C3AED" stop-opacity="0.15"/>
    </linearGradient>
    <linearGradient id="w3" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#7C3AED" stop-opacity="0.1"/>
      <stop offset="50%" stop-color="#A855F7" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#00E5FF" stop-opacity="0.1"/>
    </linearGradient>
    <linearGradient id="ftxt" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#00E5FF"/>
      <stop offset="50%" stop-color="#7C3AED"/>
      <stop offset="100%" stop-color="#A855F7"/>
    </linearGradient>
    <filter id="wg"><feGaussianBlur stdDeviation="5" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <radialGradient id="fglow" cx="50%" cy="30%" r="50%">
      <stop offset="0%" stop-color="#7C3AED" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="#7C3AED" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="1200" height="250" fill="#09090B"/>
  <rect width="1200" height="250" fill="url(#fglow)"/>

  <!-- Sakura particles in footer -->
  <g fill="#A855F7" opacity="0.3">
    <circle cx="150" cy="30" r="1.2"><animate attributeName="cy" values="30;200" dur="10s" repeatCount="indefinite"/><animate attributeName="cx" values="150;170;150" dur="5s" repeatCount="indefinite"/></circle>
    <circle cx="400" cy="50" r="1"><animate attributeName="cy" values="50;220" dur="12s" repeatCount="indefinite"/></circle>
    <circle cx="800" cy="20" r="1.3"><animate attributeName="cy" values="20;230" dur="14s" repeatCount="indefinite"/></circle>
    <circle cx="1050" cy="40" r="1"><animate attributeName="cy" values="40;210" dur="11s" repeatCount="indefinite"/></circle>
  </g>

  <!-- Wave 3 (back) -->
  <path fill="url(#w3)" opacity="0.5">
    <animate attributeName="d" values="M0,60 C200,30 400,80 600,50 C800,20 1000,70 1200,40 L1200,250 L0,250Z;M0,70 C200,50 400,30 600,60 C800,40 1000,20 1200,60 L1200,250 L0,250Z;M0,60 C200,30 400,80 600,50 C800,20 1000,70 1200,40 L1200,250 L0,250Z" dur="9s" repeatCount="indefinite"/>
  </path>
  <!-- Wave 2 -->
  <path fill="url(#w2)" opacity="0.6" filter="url(#wg)">
    <animate attributeName="d" values="M0,90 C150,60 350,110 600,80 C850,50 1050,100 1200,70 L1200,250 L0,250Z;M0,100 C150,80 350,60 600,90 C850,70 1050,50 1200,90 L1200,250 L0,250Z;M0,90 C150,60 350,110 600,80 C850,50 1050,100 1200,70 L1200,250 L0,250Z" dur="7s" repeatCount="indefinite"/>
  </path>
  <!-- Wave 1 (front) -->
  <path fill="url(#w1)" opacity="0.7" filter="url(#wg)">
    <animate attributeName="d" values="M0,120 C200,100 400,140 600,110 C800,80 1000,130 1200,100 L1200,250 L0,250Z;M0,130 C200,110 400,100 600,130 C800,110 1000,90 1200,120 L1200,250 L0,250Z;M0,120 C200,100 400,140 600,110 C800,80 1000,130 1200,100 L1200,250 L0,250Z" dur="5s" repeatCount="indefinite"/>
  </path>

  <!-- Japanese decorative -->
  <text x="100" y="190" font-family="'Yu Gothic','MS Gothic',monospace" font-size="30" fill="#00E5FF" opacity="0.04">サイバーセキュリティ</text>

  <!-- Footer text -->
  <text x="600" y="205" text-anchor="middle" font-family="'Segoe UI',sans-serif" font-size="14" fill="url(#ftxt)" letter-spacing="4" font-weight="700">
    「 DESIGNED WITH 💜 BY NIRMAY RINESH · 2026 」
  </text>
  <text x="600" y="228" text-anchor="middle" font-family="'Courier New',monospace" font-size="10" fill="#4D7CFF" opacity="0.5" letter-spacing="2">
    ARISE FROM THE SHADOW · LEVEL UP · NEVER STOP
  </text>

  <!-- Bottom accent -->
  <line x1="350" y1="240" x2="850" y2="240" stroke="url(#ftxt)" stroke-width="1" opacity="0.3"/>
</svg>
