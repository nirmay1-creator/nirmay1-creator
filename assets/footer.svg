<svg viewBox="0 0 1200 200" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="wave1" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#00E5FF" stop-opacity="0.3"/>
      <stop offset="50%" stop-color="#7C3AED" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#A855F7" stop-opacity="0.3"/>
    </linearGradient>
    <linearGradient id="wave2" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#4D7CFF" stop-opacity="0.2"/>
      <stop offset="50%" stop-color="#00E5FF" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#7C3AED" stop-opacity="0.2"/>
    </linearGradient>
    <linearGradient id="wave3" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#7C3AED" stop-opacity="0.15"/>
      <stop offset="50%" stop-color="#A855F7" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#00E5FF" stop-opacity="0.15"/>
    </linearGradient>
    <linearGradient id="footerBg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#09090B" stop-opacity="0"/>
      <stop offset="100%" stop-color="#09090B"/>
    </linearGradient>
    <linearGradient id="footerText" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#00E5FF"/>
      <stop offset="50%" stop-color="#4D7CFF"/>
      <stop offset="100%" stop-color="#A855F7"/>
    </linearGradient>
    <filter id="waveGlow">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <rect width="1200" height="200" fill="#09090B"/>

  <!-- Wave layer 3 (back) -->
  <path fill="url(#wave3)" opacity="0.6">
    <animate attributeName="d"
      values="M0,80 C200,40 400,100 600,70 C800,40 1000,90 1200,60 L1200,200 L0,200 Z;
              M0,90 C200,60 400,80 600,50 C800,70 1000,40 1200,80 L1200,200 L0,200 Z;
              M0,80 C200,40 400,100 600,70 C800,40 1000,90 1200,60 L1200,200 L0,200 Z"
      dur="8s" repeatCount="indefinite"/>
  </path>

  <!-- Wave layer 2 (mid) -->
  <path fill="url(#wave2)" opacity="0.7" filter="url(#waveGlow)">
    <animate attributeName="d"
      values="M0,100 C150,70 350,120 600,90 C850,60 1050,110 1200,80 L1200,200 L0,200 Z;
              M0,110 C150,90 350,70 600,100 C850,80 1050,60 1200,100 L1200,200 L0,200 Z;
              M0,100 C150,70 350,120 600,90 C850,60 1050,110 1200,80 L1200,200 L0,200 Z"
      dur="6s" repeatCount="indefinite"/>
  </path>

  <!-- Wave layer 1 (front) -->
  <path fill="url(#wave1)" opacity="0.8" filter="url(#waveGlow)">
    <animate attributeName="d"
      values="M0,120 C200,100 400,140 600,110 C800,80 1000,130 1200,100 L1200,200 L0,200 Z;
              M0,130 C200,110 400,100 600,130 C800,110 1000,90 1200,120 L1200,200 L0,200 Z;
              M0,120 C200,100 400,140 600,110 C800,80 1000,130 1200,100 L1200,200 L0,200 Z"
      dur="5s" repeatCount="indefinite"/>
  </path>

  <!-- Bottom gradient overlay -->
  <rect y="140" width="1200" height="60" fill="url(#footerBg)"/>

  <!-- Footer text -->
  <text x="600" y="178" text-anchor="middle" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="13" fill="url(#footerText)" letter-spacing="3" font-weight="600">
    DESIGNED WITH 💜 BY NIRMAY RINESH
  </text>

  <!-- Bottom accent line -->
  <line x1="400" y1="192" x2="800" y2="192" stroke="url(#footerText)" stroke-width="1" opacity="0.4"/>
</svg>
