<svg viewBox="0 0 1200 300" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="gridBg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#09090B"/>
      <stop offset="100%" stop-color="#0F172A" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="gridFade" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4D7CFF" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#4D7CFF" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="300" fill="url(#gridBg)"/>

  <!-- Horizontal perspective lines -->
  <g stroke="#4D7CFF" stroke-width="0.3" opacity="0.12">
    <line x1="0" y1="50" x2="1200" y2="50"/>
    <line x1="0" y1="100" x2="1200" y2="100"/>
    <line x1="0" y1="150" x2="1200" y2="150"/>
    <line x1="0" y1="200" x2="1200" y2="200"/>
    <line x1="0" y1="250" x2="1200" y2="250"/>
  </g>

  <!-- Vertical perspective lines converging -->
  <g stroke="#4D7CFF" stroke-width="0.3" opacity="0.08">
    <line x1="0" y1="300" x2="600" y2="0"/>
    <line x1="120" y1="300" x2="600" y2="0"/>
    <line x1="240" y1="300" x2="600" y2="0"/>
    <line x1="360" y1="300" x2="600" y2="0"/>
    <line x1="480" y1="300" x2="600" y2="0"/>
    <line x1="600" y1="300" x2="600" y2="0"/>
    <line x1="720" y1="300" x2="600" y2="0"/>
    <line x1="840" y1="300" x2="600" y2="0"/>
    <line x1="960" y1="300" x2="600" y2="0"/>
    <line x1="1080" y1="300" x2="600" y2="0"/>
    <line x1="1200" y1="300" x2="600" y2="0"/>
  </g>
</svg>
