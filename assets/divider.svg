<svg viewBox="0 0 800 30" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="divLine" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#00E5FF" stop-opacity="0"/>
      <stop offset="20%" stop-color="#00E5FF" stop-opacity="0.6"/>
      <stop offset="50%" stop-color="#7C3AED"/>
      <stop offset="80%" stop-color="#A855F7" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#A855F7" stop-opacity="0"/>
    </linearGradient>
    <filter id="divGlow">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Main line -->
  <line x1="100" y1="15" x2="700" y2="15" stroke="url(#divLine)" stroke-width="1" filter="url(#divGlow)"/>

  <!-- Center diamond -->
  <polygon points="400,7 408,15 400,23 392,15" fill="#00E5FF" filter="url(#divGlow)" opacity="0.9">
    <animate attributeName="opacity" values="0.5;1;0.5" dur="3s" repeatCount="indefinite"/>
  </polygon>

  <!-- Side dots -->
  <circle cx="200" cy="15" r="2" fill="#4D7CFF" opacity="0.6">
    <animate attributeName="opacity" values="0.3;0.8;0.3" dur="2s" repeatCount="indefinite"/>
  </circle>
  <circle cx="600" cy="15" r="2" fill="#A855F7" opacity="0.6">
    <animate attributeName="opacity" values="0.8;0.3;0.8" dur="2s" repeatCount="indefinite"/>
  </circle>
</svg>
