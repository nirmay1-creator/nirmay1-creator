<svg viewBox="0 0 520 300" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="termBg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0F172A"/>
      <stop offset="100%" stop-color="#09090B"/>
    </linearGradient>
    <linearGradient id="termBorder" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#00E5FF" stop-opacity="0.4"/>
      <stop offset="50%" stop-color="#7C3AED" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#A855F7" stop-opacity="0.4"/>
    </linearGradient>
    <filter id="termGlow">
      <feGaussianBlur stdDeviation="2" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Window frame -->
  <rect x="2" y="2" width="516" height="296" rx="12" fill="url(#termBg)" stroke="url(#termBorder)" stroke-width="1.5"/>

  <!-- Title bar -->
  <rect x="2" y="2" width="516" height="36" rx="12" fill="#0F172A"/>
  <rect x="2" y="26" width="516" height="12" fill="#0F172A"/>

  <!-- Window buttons -->
  <circle cx="22" cy="20" r="6" fill="#FF5F57"/>
  <circle cx="42" cy="20" r="6" fill="#FEBC2E"/>
  <circle cx="62" cy="20" r="6" fill="#28C840"/>

  <!-- Title text -->
  <text x="260" y="24" text-anchor="middle" font-family="'Courier New', monospace" font-size="12" fill="#4D7CFF" opacity="0.8">root@nirmay — ~/cybersec</text>

  <!-- Separator line -->
  <line x1="10" y1="38" x2="510" y2="38" stroke="#4D7CFF" stroke-width="0.5" opacity="0.3"/>

  <!-- Terminal content -->
  <g font-family="'Courier New', monospace" font-size="13">
    <!-- Command 1 -->
    <text x="20" y="65" fill="#7C3AED">┌──(</text>
    <text x="62" y="65" fill="#00E5FF">root㉿nirmay</text>
    <text x="173" y="65" fill="#7C3AED">)-[</text>
    <text x="197" y="65" fill="#ffffff">~/cybersec</text>
    <text x="280" y="65" fill="#7C3AED">]</text>

    <text x="20" y="85" fill="#7C3AED">└─</text>
    <text x="44" y="85" fill="#00E5FF">$ </text>
    <text x="60" y="85" fill="#ffffff">whoami</text>

    <!-- Output -->
    <text x="20" y="115" fill="#00E5FF" filter="url(#termGlow)">  ╔══════════════════════════════════════╗</text>
    <text x="20" y="135" fill="#00E5FF">  ║</text>
    <text x="42" y="135" fill="#A855F7"> ⚡ </text>
    <text x="70" y="135" fill="#ffffff">Nirmay Rinesh</text>
    <text x="390" y="135" fill="#00E5FF">║</text>

    <text x="20" y="155" fill="#00E5FF">  ║</text>
    <text x="42" y="155" fill="#4D7CFF"> 🎓 </text>
    <text x="70" y="155" fill="#888888">B.Tech CSE — Cyber Security</text>
    <text x="390" y="155" fill="#00E5FF">║</text>

    <text x="20" y="175" fill="#00E5FF">  ║</text>
    <text x="42" y="175" fill="#4D7CFF"> 🔐 </text>
    <text x="70" y="175" fill="#888888">Digital Forensics Developer</text>
    <text x="390" y="175" fill="#00E5FF">║</text>

    <text x="20" y="195" fill="#00E5FF">  ║</text>
    <text x="42" y="195" fill="#4D7CFF"> 🤖 </text>
    <text x="70" y="195" fill="#888888">AI Developer</text>
    <text x="390" y="195" fill="#00E5FF">║</text>

    <text x="20" y="215" fill="#00E5FF">  ║</text>
    <text x="42" y="215" fill="#4D7CFF"> 💻 </text>
    <text x="70" y="215" fill="#888888">Full Stack Developer</text>
    <text x="390" y="215" fill="#00E5FF">║</text>

    <text x="20" y="235" fill="#00E5FF" filter="url(#termGlow)">  ╚══════════════════════════════════════╝</text>

    <!-- New prompt with cursor -->
    <text x="20" y="265" fill="#7C3AED">└─</text>
    <text x="44" y="265" fill="#00E5FF">$ </text>
    <text x="60" y="265" fill="#ffffff">status: hacking</text>
    <rect x="190" y="253" width="8" height="16" fill="#00E5FF">
      <animate attributeName="opacity" values="1;0;1" dur="1s" repeatCount="indefinite"/>
    </rect>
  </g>
</svg>
