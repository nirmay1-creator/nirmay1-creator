<svg viewBox="0 0 1200 420" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#05000a"/>
      <stop offset="30%" stop-color="#0a0014"/>
      <stop offset="60%" stop-color="#0F172A"/>
      <stop offset="100%" stop-color="#05000a"/>
    </linearGradient>
    <linearGradient id="neonCyan" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#00E5FF" stop-opacity="0"/>
      <stop offset="30%" stop-color="#00E5FF"/>
      <stop offset="50%" stop-color="#4D7CFF"/>
      <stop offset="70%" stop-color="#7C3AED"/>
      <stop offset="100%" stop-color="#A855F7" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="titleGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#00E5FF"/>
      <stop offset="40%" stop-color="#4D7CFF"/>
      <stop offset="70%" stop-color="#7C3AED"/>
      <stop offset="100%" stop-color="#A855F7"/>
    </linearGradient>
    <radialGradient id="orbCyan" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#00E5FF" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#00E5FF" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="orbPurple" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#7C3AED" stop-opacity="0.14"/>
      <stop offset="100%" stop-color="#7C3AED" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="orbMagenta" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#A855F7" stop-opacity="0.1"/>
      <stop offset="100%" stop-color="#A855F7" stop-opacity="0"/>
    </radialGradient>
    <filter id="glow"><feGaussianBlur stdDeviation="6" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <filter id="softglow"><feGaussianBlur stdDeviation="3" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <filter id="heavyglow"><feGaussianBlur stdDeviation="12" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <pattern id="grid" width="50" height="50" patternUnits="userSpaceOnUse">
      <path d="M50 0L0 0 0 50" fill="none" stroke="#4D7CFF" stroke-width="0.25" opacity="0.12"/>
    </pattern>
    <pattern id="scanlines" width="4" height="4" patternUnits="userSpaceOnUse">
      <line x1="0" y1="0" x2="4" y2="0" stroke="#00E5FF" stroke-width="0.3" opacity="0.03"/>
    </pattern>
  </defs>

  <g>
    <!-- Deep dark background -->
    <rect width="1200" height="420" fill="url(#bg)"/>
    <rect width="1200" height="420" fill="url(#grid)"><animate attributeName="opacity" values="0.3;0.6;0.3" dur="5s" repeatCount="indefinite"/></rect>
    <rect width="1200" height="420" fill="url(#scanlines)"/>

    <!-- Ambient glow orbs -->
    <ellipse cx="150" cy="120" rx="300" ry="250" fill="url(#orbCyan)"><animate attributeName="cx" values="150;200;150" dur="10s" repeatCount="indefinite"/></ellipse>
    <ellipse cx="1050" cy="320" rx="350" ry="280" fill="url(#orbPurple)"><animate attributeName="cx" values="1050;980;1050" dur="12s" repeatCount="indefinite"/></ellipse>
    <ellipse cx="600" cy="210" rx="200" ry="180" fill="url(#orbMagenta)"><animate attributeName="opacity" values="0.5;1;0.5" dur="7s" repeatCount="indefinite"/></ellipse>

    <!-- Sakura / particle effects -->
    <g fill="#A855F7">
      <circle cx="100" cy="60" r="1.5" opacity="0.5"><animate attributeName="cy" values="60;400" dur="14s" repeatCount="indefinite"/><animate attributeName="cx" values="100;130;100" dur="7s" repeatCount="indefinite"/><animate attributeName="opacity" values="0.5;0;0.5" dur="14s" repeatCount="indefinite"/></circle>
      <circle cx="280" cy="30" r="1" opacity="0.4"><animate attributeName="cy" values="30;420" dur="18s" repeatCount="indefinite"/><animate attributeName="cx" values="280;260;280" dur="9s" repeatCount="indefinite"/></circle>
      <circle cx="450" cy="400" r="1.2" opacity="0.3"><animate attributeName="cy" values="400;20" dur="16s" repeatCount="indefinite"/><animate attributeName="opacity" values="0;0.5;0" dur="16s" repeatCount="indefinite"/></circle>
      <circle cx="750" cy="10" r="1.5" opacity="0.4"><animate attributeName="cy" values="10;410" dur="12s" repeatCount="indefinite"/><animate attributeName="cx" values="750;770;750" dur="6s" repeatCount="indefinite"/></circle>
      <circle cx="950" cy="50" r="1" opacity="0.3"><animate attributeName="cy" values="50;430" dur="20s" repeatCount="indefinite"/></circle>
      <circle cx="1100" cy="380" r="1.3" opacity="0.4"><animate attributeName="cy" values="380;10" dur="15s" repeatCount="indefinite"/></circle>
    </g>
    <g fill="#00E5FF">
      <circle cx="200" cy="350" r="1" opacity="0.3"><animate attributeName="cy" values="350;20" dur="13s" repeatCount="indefinite"/></circle>
      <circle cx="550" cy="20" r="1.5" opacity="0.4"><animate attributeName="cy" values="20;410" dur="17s" repeatCount="indefinite"/></circle>
      <circle cx="850" cy="390" r="1" opacity="0.3"><animate attributeName="cy" values="390;10" dur="11s" repeatCount="indefinite"/></circle>
    </g>

    <!-- Matrix data streams -->
    <g font-family="'Courier New',monospace" font-size="10" fill="#00E5FF" opacity="0.08">
      <text x="40" y="0"><animate attributeName="y" values="-20;440" dur="4s" repeatCount="indefinite"/>0xFF</text>
      <text x="100" y="0"><animate attributeName="y" values="-20;440" dur="5.2s" begin="1.1s" repeatCount="indefinite"/>4D7C</text>
      <text x="1060" y="0"><animate attributeName="y" values="-20;440" dur="3.8s" begin="0.5s" repeatCount="indefinite"/>A855</text>
      <text x="1130" y="0"><animate attributeName="y" values="-20;440" dur="4.6s" begin="2s" repeatCount="indefinite"/>7C3A</text>
    </g>

    <!-- Decorative Japanese text -->
    <g font-family="'Yu Gothic','MS Gothic',monospace" opacity="0.04" fill="#00E5FF">
      <text x="60" y="70" font-size="55">覚醒</text>
      <text x="950" y="390" font-size="40">正義</text>
    </g>
    <g font-family="'Yu Gothic','MS Gothic',monospace" opacity="0.03" fill="#A855F7">
      <text x="850" y="80" font-size="35">サイバー</text>
      <text x="80" y="380" font-size="30">人工知能</text>
    </g>

    <!-- Hexagonal HUD elements -->
    <g transform="translate(1060,85)" opacity="0.4">
      <polygon points="0,-35 30,-17.5 30,17.5 0,35 -30,17.5 -30,-17.5" fill="none" stroke="#00E5FF" stroke-width="0.8" filter="url(#softglow)">
        <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="25s" repeatCount="indefinite"/>
      </polygon>
      <polygon points="0,-22 19,-11 19,11 0,22 -19,11 -19,-11" fill="none" stroke="#7C3AED" stroke-width="0.6">
        <animateTransform attributeName="transform" type="rotate" from="360" to="0" dur="18s" repeatCount="indefinite"/>
      </polygon>
      <circle r="3" fill="#00E5FF" filter="url(#softglow)"><animate attributeName="opacity" values="0.3;1;0.3" dur="2s" repeatCount="indefinite"/></circle>
    </g>
    <g transform="translate(1130,310)" opacity="0.3">
      <polygon points="0,-20 17,-10 17,10 0,20 -17,10 -17,-10" fill="none" stroke="#A855F7" stroke-width="0.6">
        <animateTransform attributeName="transform" type="rotate" from="0" to="-360" dur="30s" repeatCount="indefinite"/>
      </polygon>
    </g>

    <!-- Scanning laser -->
    <line x1="0" x2="1200" stroke="url(#neonCyan)" stroke-width="1" opacity="0.35" filter="url(#softglow)">
      <animate attributeName="y1" values="-5;425;-5" dur="7s" repeatCount="indefinite"/>
      <animate attributeName="y2" values="-5;425;-5" dur="7s" repeatCount="indefinite"/>
    </line>

    <!-- Top/bottom neon accent lines -->
    <rect x="0" y="0" width="1200" height="2" fill="url(#neonCyan)" opacity="0.7"/>
    <rect x="0" y="418" width="1200" height="2" fill="url(#neonCyan)" opacity="0.7"/>

    <!-- Main title — glow layer -->
    <text x="600" y="165" text-anchor="middle" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="78" font-weight="900" fill="#00E5FF" filter="url(#heavyglow)" opacity="0.35" letter-spacing="10">NIRMAY RINESH</text>
    <!-- Main title -->
    <text x="600" y="165" text-anchor="middle" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="78" font-weight="900" fill="url(#titleGrad)" letter-spacing="10">NIRMAY RINESH</text>

    <!-- Subtitle -->
    <text x="600" y="210" text-anchor="middle" font-family="'Courier New',monospace" font-size="15" fill="#00E5FF" filter="url(#softglow)" letter-spacing="5" opacity="0.9">CYBER SECURITY  ·  AI DEVELOPER  ·  FULL STACK  ·  DIGITAL FORENSICS</text>

    <!-- Terminal prompt -->
    <g font-family="'Courier New',monospace" opacity="0.65">
      <text x="600" y="255" text-anchor="middle" font-size="12" fill="#4D7CFF">┌──[ root@nirmay ]──[ ~/cybersec ]──────────────────[ ACCESS GRANTED ]──┐</text>
      <text x="600" y="275" text-anchor="middle" font-size="12" fill="#00E5FF">│  $ ./initialize --profile --mode=legendary                           │<animate attributeName="opacity" values="0.4;1;0.4" dur="2.5s" repeatCount="indefinite"/></text>
      <text x="600" y="295" text-anchor="middle" font-size="12" fill="#A855F7">│  ████████████████████████████████████████████████████  100% COMPLETE   │</text>
      <text x="600" y="315" text-anchor="middle" font-size="12" fill="#4D7CFF">└───────────────────────────────────────────────────────────────────────┘</text>
    </g>

    <!-- Status indicators -->
    <g transform="translate(25,360)" font-family="'Courier New',monospace" font-size="10" fill="#4D7CFF" opacity="0.5">
      <circle cx="0" cy="-3" r="3" fill="#00E5FF"><animate attributeName="opacity" values="0.3;1;0.3" dur="1.5s" repeatCount="indefinite"/></circle>
      <text x="10" y="0">SYS.ONLINE</text>
      <circle cx="0" cy="15" r="3" fill="#A855F7"><animate attributeName="opacity" values="1;0.3;1" dur="2s" repeatCount="indefinite"/></circle>
      <text x="10" y="18">THREAT.LEVEL: ZERO</text>
    </g>
    <g transform="translate(1080,360)" font-family="'Courier New',monospace" font-size="10" fill="#4D7CFF" opacity="0.5" text-anchor="end">
      <text x="95" y="0">INDIA 🇮🇳</text>
      <text x="95" y="18">PARUL UNIVERSITY</text>
    </g>

    <!-- Corner brackets -->
    <g stroke="#00E5FF" stroke-width="2" fill="none" filter="url(#softglow)" opacity="0.7">
      <path d="M6,6 L6,40 M6,6 L40,6"/>
      <path d="M1194,6 L1194,40 M1194,6 L1160,6"/>
      <path d="M6,414 L6,380 M6,414 L40,414"/>
      <path d="M1194,414 L1194,380 M1194,414 L1160,414"/>
    </g>
  </g>
</svg>
