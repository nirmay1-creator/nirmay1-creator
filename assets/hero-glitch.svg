<svg viewBox="0 0 400 200" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <filter id="glitch">
      <feTurbulence type="fractalNoise" baseFrequency="0.05" numOctaves="1" result="noise">
        <animate attributeName="baseFrequency" values="0.05;0.1;0.05;0.5;0.05" dur="4s" repeatCount="indefinite"/>
      </feTurbulence>
      <feDisplacementMap in="SourceGraphic" in2="noise" scale="10" xChannelSelector="R" yChannelSelector="G">
        <animate attributeName="scale" values="2;15;2;25;2" dur="4s" repeatCount="indefinite"/>
      </feDisplacementMap>
    </filter>
    <filter id="glow">
      <feGaussianBlur stdDeviation="3" result="b"/>
      <feMerge>
        <feMergeNode in="b"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <linearGradient id="scanline" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#00E5FF" stop-opacity="0"/>
      <stop offset="50%" stop-color="#00E5FF" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#00E5FF" stop-opacity="0"/>
    </linearGradient>
  </defs>
  
  <rect width="400" height="200" fill="#09090B"/>
  
  <!-- Animated Grid -->
  <g stroke="#7C3AED" stroke-width="0.5" opacity="0.2">
    <path d="M0,50 L400,50 M0,100 L400,100 M0,150 L400,150"/>
    <path d="M100,0 L100,200 M200,0 L200,200 M300,0 L300,200"/>
    <animate attributeName="opacity" values="0.2;0.5;0.2" dur="3s" repeatCount="indefinite"/>
  </g>
  
  <!-- Cyberpunk Text -->
  <text x="200" y="105" text-anchor="middle" font-family="'Courier New',monospace" font-size="40" font-weight="900" fill="#00E5FF" filter="url(#glow)">
    SYSTEM://ACTIVE
  </text>
  
  <!-- Glitch Text Behind -->
  <text x="203" y="105" text-anchor="middle" font-family="'Courier New',monospace" font-size="40" font-weight="900" fill="#FF003C" filter="url(#glitch)" opacity="0.7">
    SYSTEM://ACTIVE
  </text>
  <text x="197" y="105" text-anchor="middle" font-family="'Courier New',monospace" font-size="40" font-weight="900" fill="#00E5FF" filter="url(#glitch)" opacity="0.7">
    SYSTEM://ACTIVE
  </text>
  
  <!-- Subtitle -->
  <text x="200" y="135" text-anchor="middle" font-family="'Segoe UI',sans-serif" font-size="12" fill="#A855F7" letter-spacing="4">
    C Y B E R P U N K   O S
  </text>
  
  <!-- Japanese Text -->
  <text x="380" y="30" text-anchor="end" font-family="'Yu Gothic','MS Gothic',sans-serif" font-size="16" fill="#4D7CFF" opacity="0.6">
    覚醒
  </text>
  
  <!-- Scanline -->
  <rect x="0" y="0" width="400" height="20" fill="url(#scanline)">
    <animate attributeName="y" values="-20;200;-20" dur="2s" repeatCount="indefinite"/>
  </rect>
  
  <!-- Hexagon -->
  <g transform="translate(40,160)" opacity="0.4">
    <polygon points="0,-15 13,-7.5 13,7.5 0,15 -13,7.5 -13,-7.5" fill="none" stroke="#00E5FF" stroke-width="1.5">
      <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="10s" repeatCount="indefinite"/>
    </polygon>
  </g>
</svg>
