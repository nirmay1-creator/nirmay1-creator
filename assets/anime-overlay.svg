<svg viewBox="0 0 1200 300" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <filter id="animeGlow">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <linearGradient id="scanGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#00E5FF" stop-opacity="0"/>
      <stop offset="50%" stop-color="#00E5FF" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#00E5FF" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <!-- Japanese decorative characters -->
  <g font-family="'MS Gothic', 'Yu Gothic', monospace" opacity="0.06" fill="#00E5FF">
    <text x="50" y="60" font-size="40">サイバー</text>
    <text x="900" y="80" font-size="35">セキュリティ</text>
    <text x="100" y="250" font-size="30">デジタル</text>
    <text x="800" y="270" font-size="32">フォレンジック</text>
    <text x="400" y="150" font-size="25">人工知能</text>
  </g>

  <!-- Circular scan pattern -->
  <g transform="translate(600, 150)">
    <circle r="120" fill="none" stroke="#00E5FF" stroke-width="0.5" opacity="0.06" stroke-dasharray="4 8">
      <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="30s" repeatCount="indefinite"/>
    </circle>
    <circle r="80" fill="none" stroke="#7C3AED" stroke-width="0.5" opacity="0.06" stroke-dasharray="6 6">
      <animateTransform attributeName="transform" type="rotate" from="360" to="0" dur="20s" repeatCount="indefinite"/>
    </circle>
    <circle r="40" fill="none" stroke="#A855F7" stroke-width="0.5" opacity="0.08" stroke-dasharray="3 9">
      <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="15s" repeatCount="indefinite"/>
    </circle>
  </g>

  <!-- HUD crosshair elements -->
  <g stroke="#00E5FF" stroke-width="0.5" opacity="0.08" filter="url(#animeGlow)">
    <!-- Top left HUD -->
    <line x1="20" y1="20" x2="80" y2="20"/>
    <line x1="20" y1="20" x2="20" y2="50"/>
    <line x1="20" y1="20" x2="40" y2="40"/>
    <!-- Top right HUD -->
    <line x1="1180" y1="20" x2="1120" y2="20"/>
    <line x1="1180" y1="20" x2="1180" y2="50"/>
    <!-- Bottom elements -->
    <line x1="20" y1="280" x2="80" y2="280"/>
    <line x1="20" y1="280" x2="20" y2="250"/>
    <line x1="1180" y1="280" x2="1120" y2="280"/>
    <line x1="1180" y1="280" x2="1180" y2="250"/>
  </g>
</svg>
