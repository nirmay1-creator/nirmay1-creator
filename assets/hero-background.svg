<svg viewBox="0 0 1200 400" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="heroBg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#09090B"/>
      <stop offset="100%" stop-color="#0F172A"/>
    </linearGradient>
    <pattern id="heroGrid" width="50" height="50" patternUnits="userSpaceOnUse">
      <path d="M 50 0 L 0 0 0 50" fill="none" stroke="#4D7CFF" stroke-width="0.2" opacity="0.12"/>
    </pattern>
    <radialGradient id="centerGlow" cx="50%" cy="60%" r="40%">
      <stop offset="0%" stop-color="#00E5FF" stop-opacity="0.06"/>
      <stop offset="100%" stop-color="#00E5FF" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="1200" height="400" fill="url(#heroBg)"/>
  <rect width="1200" height="400" fill="url(#heroGrid)"/>
  <rect width="1200" height="400" fill="url(#centerGlow)"/>

  <!-- Perspective lines converging to center -->
  <g stroke="#4D7CFF" stroke-width="0.3" opacity="0.08">
    <line x1="600" y1="200" x2="0" y2="0"/>
    <line x1="600" y1="200" x2="1200" y2="0"/>
    <line x1="600" y1="200" x2="0" y2="400"/>
    <line x1="600" y1="200" x2="1200" y2="400"/>
    <line x1="600" y1="200" x2="300" y2="0"/>
    <line x1="600" y1="200" x2="900" y2="0"/>
    <line x1="600" y1="200" x2="300" y2="400"/>
    <line x1="600" y1="200" x2="900" y2="400"/>
  </g>

  <!-- Dot matrix overlay -->
  <g fill="#00E5FF" opacity="0.04">
    <circle cx="100" cy="100" r="1"/>
    <circle cx="200" cy="100" r="1"/>
    <circle cx="300" cy="100" r="1"/>
    <circle cx="400" cy="100" r="1"/>
    <circle cx="500" cy="100" r="1"/>
    <circle cx="600" cy="100" r="1"/>
    <circle cx="700" cy="100" r="1"/>
    <circle cx="800" cy="100" r="1"/>
    <circle cx="900" cy="100" r="1"/>
    <circle cx="1000" cy="100" r="1"/>
    <circle cx="1100" cy="100" r="1"/>
    <circle cx="100" cy="200" r="1"/>
    <circle cx="200" cy="200" r="1"/>
    <circle cx="300" cy="200" r="1"/>
    <circle cx="400" cy="200" r="1"/>
    <circle cx="500" cy="200" r="1"/>
    <circle cx="600" cy="200" r="1"/>
    <circle cx="700" cy="200" r="1"/>
    <circle cx="800" cy="200" r="1"/>
    <circle cx="900" cy="200" r="1"/>
    <circle cx="1000" cy="200" r="1"/>
    <circle cx="1100" cy="200" r="1"/>
    <circle cx="100" cy="300" r="1"/>
    <circle cx="200" cy="300" r="1"/>
    <circle cx="300" cy="300" r="1"/>
    <circle cx="400" cy="300" r="1"/>
    <circle cx="500" cy="300" r="1"/>
    <circle cx="600" cy="300" r="1"/>
    <circle cx="700" cy="300" r="1"/>
    <circle cx="800" cy="300" r="1"/>
    <circle cx="900" cy="300" r="1"/>
    <circle cx="1000" cy="300" r="1"/>
    <circle cx="1100" cy="300" r="1"/>
  </g>
</svg>
