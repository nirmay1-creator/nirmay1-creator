<svg viewBox="0 0 480 280" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="cardBg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0F172A"/>
      <stop offset="100%" stop-color="#09090B"/>
    </linearGradient>
    <linearGradient id="cardBorder" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#00E5FF" stop-opacity="0.5"/>
      <stop offset="50%" stop-color="#7C3AED" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#A855F7" stop-opacity="0.5"/>
    </linearGradient>
    <linearGradient id="nameGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#00E5FF"/>
      <stop offset="100%" stop-color="#A855F7"/>
    </linearGradient>
    <radialGradient id="avatarGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#00E5FF" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#00E5FF" stop-opacity="0"/>
    </radialGradient>
    <filter id="cardGlow">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Card background -->
  <rect x="2" y="2" width="476" height="276" rx="16" fill="url(#cardBg)" stroke="url(#cardBorder)" stroke-width="1.5"/>

  <!-- Top accent line -->
  <rect x="20" y="2" width="440" height="2" rx="1" fill="url(#nameGrad)" opacity="0.6"/>

  <!-- Avatar placeholder circle -->
  <circle cx="240" cy="60" r="35" fill="url(#avatarGlow)"/>
  <circle cx="240" cy="60" r="30" fill="none" stroke="#00E5FF" stroke-width="1.5" filter="url(#cardGlow)">
    <animate attributeName="r" values="28;32;28" dur="4s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.6;1;0.6" dur="4s" repeatCount="indefinite"/>
  </circle>
  <!-- Avatar inner icon -->
  <text x="240" y="68" text-anchor="middle" font-size="28" fill="#00E5FF">⚡</text>

  <!-- Name -->
  <text x="240" y="120" text-anchor="middle" font-family="'Segoe UI', sans-serif" font-size="24" font-weight="700" fill="url(#nameGrad)" letter-spacing="3">NIRMAY RINESH</text>

  <!-- Title -->
  <text x="240" y="145" text-anchor="middle" font-family="'Courier New', monospace" font-size="12" fill="#4D7CFF" letter-spacing="2">CYBER SECURITY ENGINEER · AI DEVELOPER</text>

  <!-- Separator -->
  <line x1="80" y1="160" x2="400" y2="160" stroke="#4D7CFF" stroke-width="0.5" opacity="0.3"/>

  <!-- Info grid -->
  <g font-family="'Courier New', monospace" font-size="12">
    <text x="60" y="185" fill="#7C3AED">▸</text>
    <text x="80" y="185" fill="#888888">University</text>
    <text x="200" y="185" fill="#ffffff">Parul University</text>

    <text x="60" y="210" fill="#7C3AED">▸</text>
    <text x="80" y="210" fill="#888888">Location</text>
    <text x="200" y="210" fill="#ffffff">India 🇮🇳</text>

    <text x="60" y="235" fill="#7C3AED">▸</text>
    <text x="80" y="235" fill="#888888">Focus</text>
    <text x="200" y="235" fill="#ffffff">Digital Forensics · AI · Security</text>

    <text x="60" y="260" fill="#7C3AED">▸</text>
    <text x="80" y="260" fill="#888888">Status</text>
    <text x="200" y="260" fill="#00E5FF">● Online — Building the future</text>
  </g>

  <!-- Online status pulse -->
  <circle cx="205" cy="257" r="4" fill="#00E5FF" opacity="0">
    <animate attributeName="r" values="4;10;4" dur="2s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.4;0;0.4" dur="2s" repeatCount="indefinite"/>
  </circle>
</svg>
