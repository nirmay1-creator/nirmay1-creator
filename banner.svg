<svg viewBox="0 0 1000 300" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#050805"/>
      <stop offset="100%" stop-color="#0d1117"/>
    </linearGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="softglow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="2" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <clipPath id="frame">
      <rect x="0" y="0" width="1000" height="300" rx="14"/>
    </clipPath>
  </defs>

  <g clip-path="url(#frame)">
    <rect width="1000" height="300" fill="url(#bg)"/>
    <rect width="1000" height="300" fill="none" stroke="#173a24" stroke-width="2"/>

    <!-- matrix rain columns -->
    <g font-family="monospace" font-size="16" fill="#0f5c2e" opacity="0.75">
      <text x="20"  y="0"><tspan>01</tspan><animate attributeName="y" values="-40;340" dur="3.2s" repeatCount="indefinite"/></text>
      <text x="55"  y="0"><tspan>10</tspan><animate attributeName="y" values="-40;340" dur="4.1s" begin="0.4s" repeatCount="indefinite"/></text>
      <text x="90"  y="0"><tspan>ff</tspan><animate attributeName="y" values="-40;340" dur="2.7s" begin="0.9s" repeatCount="indefinite"/></text>
      <text x="125" y="0"><tspan>0x</tspan><animate attributeName="y" values="-40;340" dur="3.6s" begin="1.2s" repeatCount="indefinite"/></text>
      <text x="160" y="0"><tspan>11</tspan><animate attributeName="y" values="-40;340" dur="4.4s" begin="0.2s" repeatCount="indefinite"/></text>
      <text x="195" y="0"><tspan>a3</tspan><animate attributeName="y" values="-40;340" dur="3.0s" begin="1.5s" repeatCount="indefinite"/></text>
      <text x="230" y="0"><tspan>01</tspan><animate attributeName="y" values="-40;340" dur="3.9s" begin="0.6s" repeatCount="indefinite"/></text>
      <text x="265" y="0"><tspan>7c</tspan><animate attributeName="y" values="-40;340" dur="2.9s" begin="1.1s" repeatCount="indefinite"/></text>
      <text x="300" y="0"><tspan>10</tspan><animate attributeName="y" values="-40;340" dur="3.4s" begin="0.3s" repeatCount="indefinite"/></text>
      <text x="335" y="0"><tspan>e9</tspan><animate attributeName="y" values="-40;340" dur="4.0s" begin="1.4s" repeatCount="indefinite"/></text>
      <text x="600" y="0"><tspan>01</tspan><animate attributeName="y" values="-40;340" dur="3.3s" begin="0.5s" repeatCount="indefinite"/></text>
      <text x="635" y="0"><tspan>b2</tspan><animate attributeName="y" values="-40;340" dur="3.8s" begin="1.0s" repeatCount="indefinite"/></text>
      <text x="670" y="0"><tspan>10</tspan><animate attributeName="y" values="-40;340" dur="2.8s" begin="0.7s" repeatCount="indefinite"/></text>
      <text x="900" y="0"><tspan>f1</tspan><animate attributeName="y" values="-40;340" dur="4.2s" begin="0.9s" repeatCount="indefinite"/></text>
      <text x="935" y="0"><tspan>0a</tspan><animate attributeName="y" values="-40;340" dur="3.1s" begin="1.3s" repeatCount="indefinite"/></text>
      <text x="965" y="0"><tspan>11</tspan><animate attributeName="y" values="-40;340" dur="3.7s" begin="0.1s" repeatCount="indefinite"/></text>
    </g>

    <!-- rotating isometric wireframe cube ("3D" hologram) -->
    <g transform="translate(830,150)">
      <g filter="url(#glow)" stroke="#39ff14" stroke-width="1.6" fill="none">
        <g>
          <animateTransform attributeName="transform" type="rotate" from="0 0 0" to="360 0 0" dur="7s" repeatCount="indefinite"/>
          <polygon points="-45,-40 35,-40 35,40 -45,40"/>
          <polygon points="-15,-65 65,-65 65,15 -15,15" opacity="0.85"/>
          <line x1="-45" y1="-40" x2="-15" y2="-65"/>
          <line x1="35"  y1="-40" x2="65"  y2="-65"/>
          <line x1="35"  y1="40"  x2="65"  y2="15"/>
          <line x1="-45" y1="40"  x2="-15" y2="15"/>
        </g>
      </g>
      <circle r="4" fill="#39ff14" filter="url(#softglow)">
        <animate attributeName="opacity" values="0.3;1;0.3" dur="1.6s" repeatCount="indefinite"/>
      </circle>
    </g>

    <!-- scanning laser line -->
    <line x1="0" x2="1000" stroke="#39ff14" stroke-width="2" opacity="0.35" filter="url(#softglow)">
      <animate attributeName="y1" values="0;300;0" dur="5s" repeatCount="indefinite"/>
      <animate attributeName="y2" values="0;300;0" dur="5s" repeatCount="indefinite"/>
    </line>

    <!-- title block -->
    <g font-family="Courier New, monospace">
      <text x="60" y="130" font-size="46" fill="#39ff14" filter="url(#glow)" font-weight="bold">
        NIRMAY RINESH
        <animate attributeName="opacity" values="0.55;1;0.55" dur="2.4s" repeatCount="indefinite"/>
      </text>
      <text x="62" y="170" font-size="18" fill="#4dff88">
        &gt; whoami :: cybersecurity | ethical hacker | full-stack dev_
        <animate attributeName="opacity" values="1;0.2;1" dur="1.1s" repeatCount="indefinite"/>
      </text>
      <text x="60" y="205" font-size="14" fill="#1f8f45">
        [ access_granted ] [ shell: /bin/zsh ] [ uptime: always_hacking=true ]
      </text>
    </g>

    <!-- border corner brackets -->
    <g stroke="#39ff14" stroke-width="3" fill="none" filter="url(#softglow)">
      <path d="M10,10 L10,35 M10,10 L35,10"/>
      <path d="M990,10 L990,35 M990,10 L965,10"/>
      <path d="M10,290 L10,265 M10,290 L35,290"/>
      <path d="M990,290 L990,265 M990,290 L965,290"/>
    </g>
  </g>
</svg>
